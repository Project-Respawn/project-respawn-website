version: 1

frontend:
  phases:
    preBuild:
      commands:
        - |
          set -eu
          test "$AWS_BRANCH" = "master" || exit 1
          test "$TEAM_HUB_COACH_HOTFIX_ONLY" = "1" || exit 1
          test "$TEAM_HUB_COACH_HOTFIX_BASE" = "a83a874dad50395518fb0d7e2f1e853cf6bf2513" || exit 1
          changed_files=$(git diff --name-only "$TEAM_HUB_COACH_HOTFIX_BASE" HEAD) || exit 1
          printf '%s\n' "$changed_files" | while IFS= read -r changed; do
            case "$changed" in
              amplify.yml|"src/features/Team Hub/champion-pool/CoachPoolReview.vue") ;;
              *) echo "Unreviewed frontend release source"; exit 1 ;;
            esac
          done || exit 1
          test "$(sha256sum package-lock.json | cut -d ' ' -f 1)" = "2d674ee92ca07d55f728217ae18af7bc6f7a0cfb60a5fc6aba5fc76d8cd776f6" || exit 1
          source_sha=$(sha256sum 'src/features/Team Hub/champion-pool/CoachPoolReview.vue' | cut -d ' ' -f 1)
          case "$source_sha:$TEAM_HUB_FRONTEND_ARTIFACT_SHA" in
            dec761a84b88aa8ef7a4b6dafa823ff1eada30a402b7ebece705aad47ae63db8:f4a56d695de3e84c5f7bc2e1a98eea4b34be5470c390236c3975753c0d9265a0) ;;
            0f8b780f42ddddfa9ac0b44c1e0e17daebbdfe307fa8014aae520857d08c1b65:136e5d5c231e3007289bccd463a5315189c35f123269709893c3a1571449c4b6) ;;
            14f7bf2604889a4c0590a806bcc5e77a501bb8a63495af31ce34c81ebd4e6852:235c5930621cc324524e78e0b8dad1dfb52de9859544160f43293900630f4917) ;;
            *) echo "Unreviewed source/artifact pairing"; exit 1 ;;
          esac
          case "$TEAM_HUB_FRONTEND_ARTIFACT_URL" in
            "https://cdk-hnb659fds-assets-058264289478-eu-north-1.s3.eu-north-1.amazonaws.com/production/frontend-restoration/$TEAM_HUB_FRONTEND_ARTIFACT_SHA.zip?"*) ;;
            *) echo "Unreviewed artifact location"; exit 1 ;;
          esac
    build:
      commands:
        - |
          set -eu
          curl --fail --silent --show-error --location "$TEAM_HUB_FRONTEND_ARTIFACT_URL" --output /tmp/team-hub-frontend.zip
          printf '%s  %s\n' "$TEAM_HUB_FRONTEND_ARTIFACT_SHA" /tmp/team-hub-frontend.zip | sha256sum --check --strict
          test ! -e dist || { echo "Unexpected existing output directory"; exit 1; }
          mkdir dist
          unzip -q /tmp/team-hub-frontend.zip -d dist
          test -s dist/index.html
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
