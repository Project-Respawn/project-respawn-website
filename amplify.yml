version: 1

backend:
  phases:
    build:
      commands:
        - npm install
        - |
          if [ "$SWG_FRONTEND_ONLY" = "1" ]; then
            test -n "$SWG_FRONTEND_BASE" || (echo "Missing reviewed frontend base" && exit 1)
            changed_files=$(git diff --name-only "$SWG_FRONTEND_BASE" HEAD) || exit 1
            printf '%s\n' "$changed_files" | while IFS= read -r changed; do
              case "$changed" in
                amplify.yml|src/router/public.routes.js|src/views/SwgEofTest/SwgEofTest.vue|src/config/swgEofRelease.js|src/api/swgDownloads.js|scripts/swg-eof-access.test.mjs|docs/swg-eof-test-page.md) ;;
                *) echo "Unreviewed file in frontend-only release: $changed"; exit 1 ;;
              esac
            done || exit 1
            npx ampx generate outputs --branch "$AWS_BRANCH" --app-id d2cux232bpa951 --format json --out-dir .
          else
            npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id d2cux232bpa951
          fi

frontend:
  phases:
    preBuild:
      commands:
        - npm install

        # Generate Amplify outputs for the branch being deployed
        - npx ampx generate outputs --branch "$AWS_BRANCH" --app-id d2cux232bpa951 --format json --out-dir .

        # API Gateway URL is required on every hosted environment
        - test -n "$VITE_API_BASE_URL" || (echo "Missing Amplify env var VITE_API_BASE_URL" && exit 1)

        # Revolut mode handling. Every branch must be explicit so a missing
        # branch override can never select the wrong payment environment.
        - |
          if [ "$AWS_BRANCH" = "main" ] || [ "$AWS_BRANCH" = "master" ] || [ "$AWS_BRANCH" = "production" ]; then
            test "$VITE_REVOLUT_MODE" = "live" || (echo "Production requires VITE_REVOLUT_MODE=live" && exit 1)
          else
            test "$VITE_REVOLUT_MODE" = "sandbox" || (echo "Non-production branches require VITE_REVOLUT_MODE=sandbox" && exit 1)
          fi

        # Revolut public key is safe for the frontend but must be supplied
        - test -n "$VITE_REVOLUT_PUBLIC_KEY" || (echo "Missing Amplify env var VITE_REVOLUT_PUBLIC_KEY" && exit 1)

        # Show safe deployment information
        - echo "Deploying branch $AWS_BRANCH"
        - echo "Revolut frontend mode $VITE_REVOLUT_MODE"

        # Create Vite production environment
        - |
          printf "VITE_API_BASE_URL=%s\nVITE_REVOLUT_MODE=%s\nVITE_REVOLUT_PUBLIC_KEY=%s\n" \
          "$VITE_API_BASE_URL" \
          "$VITE_REVOLUT_MODE" \
          "$VITE_REVOLUT_PUBLIC_KEY" \
          > .env.production

    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
