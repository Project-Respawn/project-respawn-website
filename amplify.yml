version: 1
backend:
  phases:
    build:
      commands:
        - BRANCH_NAME=${AWS_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}
        - npx ampx pipeline-deploy --branch "$BRANCH_NAME" --app-id d2cux232bpa951
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
