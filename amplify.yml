version: 1

backend:
  phases:
    build:
      commands:
        - npm install
        - npx @aws-amplify/backend-cli@latest pipeline-deploy --branch "$AWS_BRANCH" --app-id d2cux232bpa951

frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
