version: 1

backend:
  phases:
    build:
      commands:
        - npm install
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id d2cux232bpa951

frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - test -n "$VITE_API_BASE_URL" || (echo "Missing Amplify env var VITE_API_BASE_URL" && exit 1)
        - printf "VITE_API_BASE_URL=%s\n" "$VITE_API_BASE_URL" > .env.production
    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
