<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Error — Ravens</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .error-hero{min-height:60vh;display:flex;align-items:center;justify-content:center;padding:48px 16px}
    .error-card{max-width:780px;background:linear-gradient(180deg, rgba(201,180,224,0.02), rgba(0,0,0,0.02));padding:28px;border-radius:12px;border:1px solid rgba(201,180,224,0.06);text-align:center}
    .error-code{font-size:48px;font-weight:700;margin-bottom:8px}
    .error-message{font-size:18px;color:var(--text);margin-bottom:18px}
    .error-actions a{margin:0 8px}
  </style>
</head>
<body>
  <main class="container">
    <section class="error-hero">
      <div class="error-card">
        <div class="error-code">Error</div>
        <div class="error-message">Sorry — something went wrong. If this page appeared after navigation, try refreshing or return to the homepage.</div>
        <div class="error-actions">
          <a class="btn btn-primary" href="/index.html">Home</a>
          <a class="btn btn-outline-primary" href="javascript:location.reload()">Refresh</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
